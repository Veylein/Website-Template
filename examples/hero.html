<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Example</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <!-- Hero Section -->
  <section class="hero" style="background-image: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee');">
    <div class="hero-overlay">
      <h1>Welcome to Your Website</h1>
      <p>This is the hero section. Big, bold, first impression!</p>
      <a href="#" class="btn">Learn More</a>
    </div>
  </section>

  <!-- Explanation -->
  <section class="section">
    <h2>How it works</h2>
    <p>
      - <code>.hero</code> → full-screen background section<br>
      - <code>.hero-overlay</code> → semi-transparent overlay for text readability<br>
      - <code>.btn</code> → styled clickable button
    </p>
  </section>

</body>
</html>
